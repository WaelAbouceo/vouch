name: OpenSSF Scorecard

# Supply-chain security analysis. Publishes results to the public Scorecard
# viewer and feeds the README badge, and uploads SARIF to code scanning.
on:
  branch_protection_rule:
  schedule:
    - cron: "20 7 * * 1" # weekly, Monday 07:20 UTC
  push:
    branches: ["main"]

# Least-privilege by default.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the Scorecard API (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
