name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  self-scan:
    # Dogfood: the validator scans its own example skills.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Benign example must pass
        run: vouch ./examples/benign-skill --no-llm --no-color --fail-on suspicious
      - name: Malicious example must be caught
        run: |
          if vouch ./examples/malicious-skill --no-llm --no-color --fail-on malicious; then
            echo "Expected malicious verdict but scan passed"; exit 1
          else
            echo "Correctly flagged malicious example"
          fi
