name: "Vouch"
description: "Vet agent Skills for malicious behavior and fail CI on ones you can't vouch for."
branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: "Path to a skill directory/file, or a directory containing many skills."
    required: false
    default: "."
  fail-on:
    description: "Verdict level that fails the job: suspicious | malicious | never."
    required: false
    default: "malicious"
  use-llm:
    description: "Enable the LLM auditor (requires CURSOR_API_KEY). true|false."
    required: false
    default: "false"
  cv:
    description: "Also print a Skill CV for each scanned skill. true|false."
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install vouch
      shell: bash
      run: python -m pip install --quiet "vouch @ git+https://github.com/OWNER/REPO@main" || python -m pip install --quiet vouch

    - name: Scan skills
      shell: bash
      env:
        SV_PATH: ${{ inputs.path }}
        SV_FAIL_ON: ${{ inputs.fail-on }}
        SV_USE_LLM: ${{ inputs.use-llm }}
        SV_CV: ${{ inputs.cv }}
      run: |
        set -euo pipefail
        llm_flag="--no-llm"; [ "$SV_USE_LLM" = "true" ] && llm_flag="--llm"
        status=0

        # Discover skills: any SKILL.md under the path, else treat path itself.
        mapfile -t skills < <(find "$SV_PATH" -type f -iname 'SKILL.md' -exec dirname {} \; | sort -u)
        if [ "${#skills[@]}" -eq 0 ]; then skills=("$SV_PATH"); fi

        for s in "${skills[@]}"; do
          echo "::group::Scanning $s"
          if [ "$SV_CV" = "true" ]; then
            vouch "$s" --cv $llm_flag --no-color || true
          fi
          if ! vouch "$s" $llm_flag --no-color --fail-on "$SV_FAIL_ON"; then
            echo "::error title=Unsafe skill::$s failed at fail-on=$SV_FAIL_ON"
            status=1
          fi
          echo "::endgroup::"
        done
        exit $status
