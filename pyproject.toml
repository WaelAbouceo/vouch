[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vouch-agent"
version = "0.10.0"
description = "Security scanner for AI-agent skills: audit every SKILL.md on your machine for malware, prompt injection, and secret exfiltration. Deterministic static analysis (with an optional LLM layer) for Claude, Cursor, and MCP skills — like npm audit / semgrep, but for agent skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wael Abouella" }]
keywords = [
  "ai-agents",
  "agent-security",
  "ai-security",
  "llm-security",
  "skills",
  "skill-security",
  "security-scanner",
  "static-analysis",
  "sast",
  "supply-chain-security",
  "prompt-injection",
  "malware-detection",
  "secret-exfiltration",
  "audit",
  "mcp",
  "claude",
  "cursor",
  "vouch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
mcp = ["mcp>=1.2.0,<2"]  # v1 API (FastMCP); mcp 2.x renamed it to MCPServer
llm = ["cursor-sdk>=0.1.0"]
openai = ["openai>=1.0"]
seg = ["sovereigneg>=0.1.0"]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "pillow>=10",
  # Exercise the optional delivery forms in CI (their smoke tests caught two
  # real shipped bugs). mcp is pinned <2 to match the v1 FastMCP code and to
  # coexist with fastapi's starlette pin (verified via `pip check`).
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic>=2",
  "mcp>=1.2.0,<2",
]
all = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "mcp>=1.2.0,<2",
  "openai>=1.0",
  "sovereigneg>=0.1.0",
  "pytest>=8",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/WaelAbouceo/vouch"
Repository = "https://github.com/WaelAbouceo/vouch"
Changelog = "https://github.com/WaelAbouceo/vouch/blob/main/CHANGELOG.md"
Issues = "https://github.com/WaelAbouceo/vouch/issues"

[project.scripts]
vouch = "vouch.cli:main"
vouch-api = "vouch.api:run"
vouch-mcp = "vouch.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vouch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin an explicit rule set so linting is deterministic across ruff versions.
select = ["E", "F", "I", "W", "UP"]
