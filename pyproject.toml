[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vouch"
version = "0.3.0"
description = "Vouch — the trust layer for AI agents. Vet Skills and agents, profile them with CVs, and vouch only for the safe ones (hybrid static + LLM analysis)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SKILLS_RGB" }]
keywords = [
  "security",
  "agents",
  "skills",
  "static-analysis",
  "prompt-injection",
  "skill-cv",
  "agent-cv",
  "vouch",
  "mcp",
  "cursor-sdk",
]

dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2"]
mcp = ["mcp>=1.2.0"]
llm = ["cursor-sdk>=0.1.0"]
dev = ["pytest>=8", "ruff>=0.5"]
all = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "mcp>=1.2.0",
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
vouch = "vouch.cli:main"
vouch-api = "vouch.api:run"
vouch-mcp = "vouch.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
